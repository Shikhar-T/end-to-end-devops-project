apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-demo-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-demo-app

  template:
    metadata:
      labels:
        app: devops-demo-app

    spec:
      containers:
      - name: devops-demo-container
        image: shikhardevops/devops-demo-app:5

        ports:
        - containerPort: 80
